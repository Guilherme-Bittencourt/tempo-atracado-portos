[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo-atracado"
version = "2.0.0"
description = "Predição do tempo atracado de navios em portos brasileiros com dados abertos da ANTAQ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.4,<1.11",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "catboost>=1.2",
    "xgboost>=2.0",
    "shap>=0.44",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tempo-atracado = "tempo_atracado.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
